name: mms

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mms"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-plan:
    image: postgres:18.7
    environment:
      POSTGRES_DB: mms_plan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mms_plan"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@postgres:5432/mms
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_PRE_REQUEST: private.pre_request
      PGRST_JWT_AUD: mms-api
      PGRST_JWT_SECRET: dev-only-change-me
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8090:8080"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    ports:
      - "127.0.0.1:10000:10000"
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck"

volumes:
  postgres-data:
